<title>Alicia Cubero · ACubero RRHH & Laboral</title>

<style>
  /* Tokens de marca: los mismos valores que portal/estaticos/tokens.css
     (repo aliciacubero), fuente única de la identidad de ACUBERO. */
  :root {
    --teal-50:  #f2f8f8;
    --teal-100: #e0eeee;
    --teal-200: #c4dede;
    --teal-300: #9ecece;
    --teal-400: #7fbcbb;
    --teal-500: #6babaa;
    --teal-600: #4d8f8e;
    --teal-700: #3d7372;
    --teal-800: #325c5c;
    --teal-900: #2b4c4b;

    --cream: #f5f0ea;
    --sand:  #f7f4f0;

    --ink:      #12211f;
    --ink-soft: #2a2a2a;
    --muted:    #5a6c6b;
    --hairline: #e6e0d8;

    --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
    --sans:  "Jost", ui-sans-serif, system-ui, -apple-system, sans-serif;

    --radius-card: 20px;
    --radius-boton: 14px;
    --radius-pill: 999px;

    --shadow-soft:  0 2px 14px rgba(18, 33, 31, .05);
    --shadow-card:  0 8px 30px -12px rgba(45, 76, 75, .18);
    --shadow-lift:  0 22px 50px -20px rgba(45, 76, 75, .32);
    --shadow-brand: 0 12px 30px -10px color-mix(in srgb, var(--teal-500) 55%, transparent);

    --accion: var(--teal-700);
    --accion-hover: var(--teal-800);
    --degradado: linear-gradient(135deg, #6babaa 0%, #4d8f8e 100%);
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    font-weight: 300;
    background: var(--sand);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Elipse degradada de cabecera, tenue como en el hero de la web */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 360px;
    background: linear-gradient(160deg,
      color-mix(in srgb, var(--teal-500) 30%, transparent) 0%,
      color-mix(in srgb, var(--teal-300) 20%, transparent) 45%,
      rgba(247,244,240,0) 100%);
    z-index: 0;
    clip-path: ellipse(130% 100% at 50% 0%);
  }
  /* Malla muy tenue (grid-veil de la web) */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--teal-500) 8%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--teal-500) 8%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .4;
    z-index: 0;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, transparent 420px);
            mask-image: linear-gradient(to bottom, #000 0, transparent 420px);
  }
  :focus-visible {
    outline: 2px solid var(--teal-600);
    outline-offset: 3px;
    border-radius: 4px;
  }
  ::selection { background: var(--teal-200); color: var(--teal-900); }

  .header {
    width: 100%;
    max-width: 420px;
    padding: 48px 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  /* Flip card */
  .flip-card {
    width: 140px;
    height: 140px;
    perspective: 900px;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
  }
  /* Anillos concéntricos alrededor de la tarjeta, como la composición del hero */
  .flip-card::before,
  .flip-card::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--teal-400) 35%, transparent);
    pointer-events: none;
  }
  .flip-card::before { inset: -14px; }
  .flip-card::after  { inset: -28px; border-style: dashed; border-color: color-mix(in srgb, var(--teal-400) 25%, transparent); }
  .flip-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s var(--ease);
  }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-front, .flip-back {
    position: absolute; inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    box-shadow: var(--shadow-lift), var(--shadow-brand);
  }
  .flip-front {
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 26px;
  }
  .flip-front svg { width: 100%; height: auto; display: block; }
  .flip-back { transform: rotateY(180deg); }
  .flip-back img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    display: block;
  }
  .flip-hint {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--muted);
    opacity: .7;
    text-transform: uppercase;
    margin-top: 28px;
    margin-bottom: 14px;
  }
  .name {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.015em;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .services-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 10px;
    max-width: 340px;
  }
  .service-tag {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal-700);
    background: rgba(255,255,255,0.7);
    border: 1px solid color-mix(in srgb, var(--teal-300) 70%, transparent);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
  }
  .sep, .divider {
    width: 100%;
    max-width: 420px;
    height: 1px;
    background: linear-gradient(90deg, transparent,
      color-mix(in srgb, var(--teal-500) 35%, transparent) 30%,
      color-mix(in srgb, var(--teal-500) 35%, transparent) 70%, transparent);
    position: relative;
    z-index: 1;
  }
  .sep { margin: 4px 0 0; }
  .divider { margin: 8px 0; }
  .contact-section {
    width: 100%;
    max-width: 420px;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-card);
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-card);
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s;
  }
  .contact-row:hover { border-color: var(--teal-300); box-shadow: var(--shadow-lift); }
  .contact-row:active { transform: scale(0.98); }
  .contact-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--degradado);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .contact-value {
    font-size: 14px;
    font-weight: 400;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact-arrow { color: var(--teal-500); flex-shrink: 0; }
  .buttons {
    width: 100%; max-width: 420px;
    padding: 8px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative; z-index: 1;
  }
  .btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px;
    border-radius: var(--radius-boton);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: transform 0.2s ease-out, box-shadow 0.2s ease-out, background-color 0.2s, border-color 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  /* Acción principal: teal-700 (contraste AA con blanco) y sombra teal */
  .btn-primary {
    background: var(--accion);
    color: #fff;
    box-shadow: var(--shadow-brand);
  }
  .btn-primary:hover { background: var(--accion-hover); }
  .btn-primary:focus-visible { outline: 3px solid var(--accion); outline-offset: 3px; }
  .btn-outline {
    background: #fff;
    color: var(--teal-700);
    border: 1px solid var(--teal-300);
  }
  .btn-outline:hover { border-color: var(--teal-500); background: var(--teal-50); }
  .btn-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  .btn-text-sec { font-size: 10px; font-weight: 300; letter-spacing: 0.08em; opacity: 0.8; }
  /* Pie: lockup horizontal del logo (marca + ACUBERO + RRHH & Laboral) */
  .footer {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative; z-index: 1;
  }
  .logotipo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .logotipo svg { width: 40px; height: 40px; flex-shrink: 0; }
  .logotipo-texto { display: flex; flex-direction: column; line-height: 1; text-align: left; }
  .logotipo-nombre {
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.19em;
    color: var(--ink);
  }
  .logotipo-descriptor {
    margin-top: 5px;
    font-family: var(--serif);
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--teal-700);
  }
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 10px 22px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    letter-spacing: 0.04em;
    box-shadow: var(--shadow-lift);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
